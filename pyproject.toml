[project]
name = "restaurant-fastapi"
version = "0.1.0"
description = "API para comandas de restaurante"
authors = [
  { name = "Jorge Trujillo", email = "jorge.itrujillo93@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.110.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.24.0",
  "alembic>=1.13.0",
  "gunicorn>=22.0.0",
  "python-jose[cryptography]>=3.3.0",
  "python-dotenv>=1.0.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models", "schemas", "routers", "utils"]